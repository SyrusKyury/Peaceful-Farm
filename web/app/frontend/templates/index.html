<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Peaceful Farm</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
		<link rel="stylesheet" href="/static/css/clouds.css">
		<link rel="icon" href="static/favicon.ico" type="image/x-icon">
	</head>
	<body class="bg-blue-200 flex flex-col items-center justify-start min-h-screen relative">
		<!-- Top Menu-->
		<nav class="top-0 left-0 w-full bg-white bg-opacity-70 shadow-md flex items-center justify-between p-4 z-50 h-16">
			<!-- App Icon -->
			<a href="/">
				<div class="flex items-center space-x-2">
					<img src="/static/logo.png" alt="App Icon" class="h-24 w-42">
				</div>
			</a>
			<!-- Menu Items -->
			<div class="flex space-x-2 items-stretch h-full">
				<a href="#" id="submit-flag-btn" title="Submit a flag manually" class="flex items-center justify-center bg-[#6ec5e9] hover:bg-[#55a5c0] rounded-xl p-3 transition-all duration-200">
				<img src="/static/flag.png" class="w-6 h-6">
				</a>
				<a href="csv" title="Download Flags as CSV" class="flex items-center justify-center bg-[#6ec5e9] hover:bg-[#55a5c0] rounded-xl p-3 transition-all duration-200">
				<img src="/static/csv.png" class="w-6 h-6">
				</a>
				<a href="client" title="Download Client" class="flex items-center justify-center bg-[#6ec5e9] hover:bg-[#55a5c0] rounded-xl p-3 transition-all duration-200">
				<img src="/static/exploit.png" class="w-6 h-6">
				</a>
				<a href="settings" title="Settings" class="flex items-center justify-center bg-[#6ec5e9] hover:bg-[#55a5c0] rounded-xl p-3 transition-all duration-200">
				<img src="/static/settings.png" class="w-6 h-6">
				</a>
				<a href="logout" title="Logout" class="flex items-center justify-center bg-[#54c168] hover:bg-[#078030] rounded-xl p-3 transition-all duration-200">
				<img src="/static/logout.png" class="w-6 h-6">
				</a>
			</div>
		</nav>

        <div class="w-full bg-gray-200 rounded-full h-2.5 mb-4 dark:bg-white-700">
            <div id="progress-bar" class="bg-[#54c168] h-2.5 rounded-full dark:bg-[#54c168]" style="width: 0%"></div>
        </div>
        

		<!-- Background with moving clouds -->
		<div id="background-wrap" class="fixed top-0 left-0 w-full h-full -z-10">
			<div class="x1">
				<div class="cloud"></div>
			</div>
			<div class="x2">
				<div class="cloud"></div>
			</div>
			<div class="x3">
				<div class="cloud"></div>
			</div>
			<div class="x4">
				<div class="cloud"></div>
			</div>
			<div class="x5">
				<div class="cloud"></div>
			</div>
		</div>

		<div id="flag-popup" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50">
			<div class="bg-white p-6 rounded-lg shadow-lg w-96">
				<h2 class="text-lg font-bold mb-4">Submit a Flag</h2>
				<label class="block mb-2">Flag:</label>
				<input type="text" id="flag-input" class="w-full p-2 border border-gray-300 rounded mb-4">
				<div class="flex items-center mb-4">
					<input type="checkbox" id="urgent-flag" class="mr-2">
					<label for="urgent-flag">Urgent</label>
				</div>
				<div class="flex justify-end space-x-2">
					<button id="close-popup" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded">Cancel</button>
					<button id="submit-flag" class="bg-[#54c168] hover:bg-[#078030] text-white px-4 py-2 rounded">Submit</button>
				</div>
			</div>
		</div>

		<!-- Centered Content Container -->
		<div class="relative bg-white bg-opacity-90 shadow-lg rounded-xl p-8 w-11/12 mt-20 flex flex-col">
			<!-- Chart Canvas -->
			<canvas id="chart"></canvas>
			<!-- Search bar (Row Layout) -->
			<div class="mt-4 flex flex-row items-center justify-between w-full">
				<input type="text" id="search" class="w-full px-4 py-2 border border-[#6ec5e9] rounded-lg focus:ring-4 focus:ring-blue-300" placeholder="Search...">
			</div>
			<!-- Button Container (Row Layout) -->
			<div class="mt-4 flex flex-row items-center justify-between w-full">
				<div class="flex w-full overflow-hidden">
					<button id="ip-button" type="button" class="flex flex-row items-center justify-center flex-1 py-1 px-3 bg-[#6ec5e9] text-white font-bold rounded-l-lg hover:bg-[#55a5c0] focus:ring-4 focus:ring-blue-300 whitespace-nowrap" onclick="handleButtonClick(this)">
					<img src="/static/ip.png" class="w-4 h-4 mr-2"> IP Addresses
					</button>
					<button id="exploit-button" type="button" class="flex flex-row items-center justify-center flex-1 py-1 px-3 bg-[#6ec5e9] text-white font-bold border-l border-white hover:bg-[#55a5c0] focus:ring-4 focus:ring-blue-300 whitespace-nowrap" onclick="handleButtonClick(this)">
					<img src="/static/exploit.png" class="w-4 h-4 mr-2"> Exploit
					</button>
					<button id="nickname-button" type="button" class="flex flex-row items-center justify-center flex-1 py-1 px-3 bg-[#6ec5e9] text-white font-bold border-l border-white hover:bg-[#55a5c0] focus:ring-4 focus:ring-blue-300 whitespace-nowrap" onclick="handleButtonClick(this)">
					<img src="/static/nickname.png" class="w-4 h-4 mr-2"> Attacker
					</button>
					<button id="service-button" type="button" class="flex flex-row items-center justify-center flex-1 py-1 px-3 bg-[#6ec5e9] text-white font-bold rounded-r-lg border-l border-white hover:bg-[#55a5c0] focus:ring-4 focus:ring-blue-300 whitespace-nowrap" onclick="handleButtonClick(this)">
					<img src="/static/service.png" class="w-4 h-4 mr-2"> Service
					</button>
				</div>
			</div>
			<!-- Table -->
			<table class="min-w-full table-auto border-collapse pt-6 rounded-lg overflow-hidden mt-4">
				<thead class="bg-[#54c168] text-white">
					<tr>
						<th class="px-4 py-2 border-b">
							<img src="/static/exploit.png" class="inline-block w-4 h-4 ml-2">
							Exploit 
						</th>
						<th class="px-4 py-2 border-b">
							<img src="/static/flag.png" class="inline-block w-4 h-4 ml-2">
							Accepted flags 
						</th>
						<th class="px-4 py-2 border-b">
							<img src="/static/flag.png" class="inline-block w-4 h-4 ml-2">
							Rejected flags 
						</th>
						<th class="px-4 py-2 border-b">
							<img src="/static/flag.png" class="inline-block w-4 h-4 ml-2">
							Pending flags 
						</th>
					</tr>
				</thead>
				<tbody>
				</tbody>
			</table>
		</div>
		<div id="notifications-container" class="fixed bottom-4 right-4 space-y-2"></div>
		<script>
			const ctx = document.getElementById('chart').getContext('2d');
			const notification_sound = new Audio('/static/snd/notification.mp3');
			let chart;
			
			// Function to handle button click
			function handleButtonClick(button) {
			    if (button.classList.contains('bg-[#55a5c0]'))
			        return

				// Memorize the clicked button into the session storage
				sessionStorage.setItem('clickedButton', button.id);
			
			    // Reset all buttons to default state
			    document.querySelectorAll('.flex-row button').forEach(btn => {
			        btn.classList.remove('bg-[#55a5c0]');
			        btn.classList.add('bg-[#6ec5e9]');
			    });
			
			    // Set the clicked button to "pressed" state
			    button.classList.remove('bg-[#6ec5e9]');
			    button.classList.add('bg-[#55a5c0]');
			
			    const buttonId = button.id.replace('-button', '');
			    updateTable(buttonId);
				plot(buttonId);
			}
			
			function updateTable(filterGroup) {
			    fetch('/group?group=' + filterGroup)
			    .then(response => response.json())
			    .then(response => {
			        const tbody = document.querySelector("table tbody");
			        tbody.innerHTML = "";
			        
			        // Update the first column name with the filterGroup
			        let firstColumnHeader = document.querySelector("table thead th:first-child");
			        firstColumnHeader.innerHTML = `
			        <img src="/static/${filterGroup}.png" class="inline-block w-4 h-4 ml-2">
			        ${filterGroup.charAt(0).toUpperCase() + filterGroup.slice(1)}
			        `;
			
			
			        response.forEach((row, index) => {
			            let trClass = index % 2 === 0 ? "bg-[#eaf9fb]" : "bg-white";
			            
			            let tr = document.createElement("tr");
			            tr.className = trClass;
			            
						row.forEach((cellData, index) => {
							let td = document.createElement("td");
							td.className = "px-4 py-2 border-b text-[#55a5c0]";

							if (index === 0) {
								let a = document.createElement("a");
								a.href = "/info?type="+filterGroup+"&value="+cellData;
								a.textContent = cellData;
								a.className = "text-[#54c168] underline hover:text-[#078030] underline";
								td.appendChild(a);
							} else {
								td.textContent = cellData;
							}

							tr.appendChild(td);
						});

			            
			            tbody.appendChild(tr);
			        });
			    })
			    .catch(error => console.error("Error loading data:", error));
			}
			
			function showNotification(message, color) {
                // Create a new notification element
                const notification = document.createElement('div');
                if (color === "green")
                {
                    notification.classList.add('bg-[#54c168]', 'text-white', 'p-4', 'rounded-lg', 'shadow-lg', 'flex', 'items-center', 'justify-between', 'space-x-2');
                }
                else if (color === "blue")
                {
                    notification.classList.add('bg-[#6ec5e9]', 'text-white', 'p-4', 'rounded-lg', 'shadow-lg', 'flex', 'items-center', 'justify-between', 'space-x-2');
                }
                // Update table
                document.querySelectorAll('.flex-row button').forEach(btn => {
                    if(btn.classList.contains('bg-[#55a5c0]'))
                    {
                        updateTable(btn.id.replace('-button', ''));
						plot(btn.id.replace('-button', ''));
                    }
                });
				notification_sound.play();
                // Create the message content with HTML formatting
                const messageElement = document.createElement('div');
                messageElement.innerHTML = message; // Insert HTML content to format the message
                
                // Create the close button
                const closeButton = document.createElement('button');
                closeButton.classList.add('text-white', 'font-bold');
                closeButton.innerHTML = '&times;';
                closeButton.onclick = function() {
                    notification.remove();
                };
                
                // Add the message and close button to the notification
                notification.appendChild(messageElement);
                notification.appendChild(closeButton);
                
                // Add the notification to the container
                const container = document.getElementById('notifications-container');
                container.appendChild(notification);
                
                // Automatically hide the notification after 5 seconds
                setTimeout(() => {
                    notification.remove();  // Remove the notification after 5 seconds
                }, 10000);
            }

			
			// Ascolta le notifiche dal server (Socket.IO)
			const socket = io.connect('{{address}}');
			socket.on('message', function(message) {
			console.log(message);
			showNotification(message.data, message.color || "green");
			});

            function calculateTickPercentage(startDate, tickDuration) {
            // Get the current date and time
            const currentDate = new Date();

            // Calculate the time difference in milliseconds between the current date and the start date
            const timeDifference = currentDate - new Date(startDate);

            // Calculate the position within the tick (between 0 and tickDuration)
            const tickPosition = timeDifference % tickDuration;

            // Calculate the percentage of the tick completed
            const percentage = (tickPosition / tickDuration) * 100;

            return percentage;
        }

        function updateProgressBar() {
            const competitionStartDate = '{{start}}'; // Start date of the competition (ISO format)
            const tickDuration = '{{tick}}'; // Duration of each tick in milliseconds (e.g., 60,000 ms = 1 minute)

            // Calculate the current progress percentage
            const tickPercentage = calculateTickPercentage(competitionStartDate, tickDuration);

            // Update the progress bar width based on the calculated percentage
            const progressBar = document.getElementById('progress-bar');
			progressBar.style.width = `${tickPercentage}%`;
        }

		function getRandomColor() {
			return `rgba(${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)}, 1)`;
		}


		function plot(group) {
			fetch('/stats?group=' + group)
				.then(response => response.json())
				.then(data => {
				// Estrai tutti gli IP
				const entries = Object.values(data).flatMap(tick => Object.keys(tick));
				const uniqueEntries = [...new Set(entries)];

				// Inizializza il nuovo dizionario
				const result = uniqueEntries.reduce((acc, entry) => {
				acc[`${entry} accepted`] = [];
				acc[`${entry} rejected`] = [];
				return acc;
				}, {});

				// Ordina i tick per chiave (timestamp)
				const sortedTicks = Object.keys(data).sort();

				// Itera in ordine sui tick e aggiorna il dizionario result
				sortedTicks.forEach(tick => {
				const tickData = data[tick];

				uniqueEntries.forEach(entry => {
					const accepted = tickData[entry]?.accepted || 0;
					const rejected = tickData[entry]?.rejected || 0;
					
					result[`${entry} accepted`].push(accepted);
					result[`${entry} rejected`].push(rejected);
				});
				});

				const datasets = Object.keys(result).map(key => {
				const color = getRandomColor();
				return {
					label: key,
					data: result[key],
					borderColor: color,
					backgroundColor: color.replace(", 1)", ", 0.2)"),
					borderWidth: 2,
					tension: 0.3
				};
				});

				// 7. Creare il grafico con Chart.js
				if (chart) {
					chart.destroy();
				}

				const chartCanvas = document.getElementById('chart');
				chartCanvas.width = 600;  // Larghezza fissa
				chartCanvas.height = 100; // Altezza fissa

				chart = new Chart(ctx, {
				type: 'line',
				data: {
					labels: sortedTicks, // Asse X con i tick
					datasets: datasets
				},
				options: {
					responsive: true,
					scales: {
					y: {
						beginAtZero: true
					}
					}
				}
				});


				})
				.catch(error => console.error('Errore durante il fetch:', error));
		}

		document.getElementById('search').addEventListener('input', function() {
			const searchValue = this.value.toLowerCase();
			const rows = document.querySelectorAll("table tbody tr");

			rows.forEach(row => {
				const firstColumnText = row.querySelector("td:first-child")?.textContent.toLowerCase() || "";
				row.style.display = firstColumnText.includes(searchValue) ? "" : "none";
			});
		});

		document.getElementById('submit-flag-btn').addEventListener('click', function(event) {
			event.preventDefault(); // Evita la navigazione predefinita
			document.getElementById('flag-popup').classList.remove('hidden');
		});

		document.getElementById('close-popup').addEventListener('click', function() {
			document.getElementById('flag-popup').classList.add('hidden');
		});

		document.getElementById('submit-flag').addEventListener('click', function() {
			const flag = {'Front-End Submission' : [document.getElementById('flag-input').value]};
			const isUrgent = document.getElementById('urgent-flag').checked;
			const api_key = '{{api_key}}';
			const exploit = 'Front-End Submission';
			const service = 'Front-End Submission';
			const nickname = 'Front-End Submission';
			
			if (document.getElementById('flag-input').value.trim() === "") {
				
				return;
			}
			
			fetch('/flags', {
				method: 'POST',
				headers: {
				'Content-Type': 'application/json',
				},
				body: JSON.stringify({
				flags: flag,
				exploit: exploit,
				service: service,
				nickname: nickname,
				api_key: api_key,
				urgent: isUrgent
				})
			}).catch(error => {
				// Handle error
				alert('An error occurred. Please try again later.');
				console.log(error);
			});
		});

		document.getElementById('flag-popup').addEventListener('click', function(event) {
		// Se l'utente clicca sullo sfondo (non sulla finestra del popup)
		if (event.target === this) {
			this.classList.add('hidden');
		}
		});


        // Update the progress bar every 200 milliseconds
        setInterval(updateProgressBar, 200);

		// Check session storage for a previously clicked button
		const clickedButton = sessionStorage.getItem('clickedButton') || 'ip-button';
		document.getElementById(clickedButton).click();
		</script>
	</body>
</html>
